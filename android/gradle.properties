org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Eingebautes Kotlin von AGP 9 ist noch nicht nutzbar (Stand 2026-08): der
# Flutter-Gradle-Loader richtet Kotlin fuer jedes Plugin-Modul ein, und mit
# android.builtInKotlin=true liegt das Kotlin-Gradle-Plugin nicht mehr auf dem
# Klassenpfad. Der Bau bricht dann schon am ersten Plugin ab.
#
# Ob es inzwischen geht, beantwortet tool/check_kgp.ps1 mit einem Probebau.
# Laeuft der durch, koennen beide Flags auf true und die Zeile
# org.jetbrains.kotlin.android aus android/settings.gradle.kts entfallen.
# Siehe docs/android-kotlin.md.
android.newDsl=false
android.builtInKotlin=false
