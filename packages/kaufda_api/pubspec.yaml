name: kaufda_api
description: >-
  Dart-Client fuer die interne kaufDA Content-Viewer-API (content-viewer-be.kaufda.de)
  inklusive Session-Bootstrap und Event-Tracking. Reines Dart, damit es in Flutter
  auf allen Plattformen laeuft.
version: 0.4.0
publish_to: none

environment:
  sdk: ^3.6.0

dependencies:
  args: ^2.6.0
  http: ^1.2.2
  meta: ^1.15.0

dev_dependencies:
  lints: ^5.1.0
  test: ^1.25.0

executables:
  kaufda: kaufda
