name: prospect_client
description: >-
  Ruft digitale Prospekte deutscher Supermaerkte und Einzelhandelsketten ab und
  stellt sie ueber ein quellenunabhaengiges Datenmodell bereit. Reines Dart,
  ohne Flutter-Abhaengigkeit, standalone per CLI ausfuehrbar.
version: 0.3.0
publish_to: none

environment:
  sdk: ^3.6.0

dependencies:
  args: ^2.6.0
  http: ^1.2.2
  kaufda_api:
    path: ../kaufda_api
  meta: ^1.16.0

dev_dependencies:
  lints: ^5.1.1
  test: ^1.25.15

executables:
  prospect_client:
