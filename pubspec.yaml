name: multiapp
description: "Haushalts-App: Inventar, Einkaufsliste, Notizen, Pillen- und Tier-Tracker"
publish_to: 'none'

# Semantische Versionierung: major.minor.patch (+ Build-Nummer).
version: 0.25.5+70

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Zustandsverwaltung und Navigation
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0

  # Lokale Datenhaltung (offline-first)
  drift: ^2.34.2
  drift_flutter: ^0.3.1

  # Hilfsbibliotheken
  uuid: ^4.6.0
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  collection: ^1.19.1
  http: ^1.6.0
  # Pruefsumme der heruntergeladenen Update-Pakete (SHA-256).
  crypto: ^3.0.7
  mobile_scanner: ^7.4.0
  flutter_local_notifications: ^22.1.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  supabase_flutter: ^2.16.0
  # Prospekte und Angebote deutscher Supermaerkte (kaufDA, Tjek, Schwarz).
  prospect_client:
    path: packages/prospect_client
  app_links: ^7.2.1
  win32_registry: ^3.0.3
  # Biometrisches App-Schloss (Windows Hello / Fingerabdruck / Gesicht).
  # 3.x wird gebraucht: zieht local_auth_windows 2.x mit dem modernen
  # C++20-<coroutine>-Header (1.x scheitert an neuem MSVC, Fehler STL1011).
  local_auth: ^3.0.2
  # Datenexport (DSGVO): JSON-Datei speichern/teilen.
  share_plus: ^13.3.0
  path_provider: ^2.1.5
  # Push bei geschlossener App (nur Android). Firebase ist optional: ohne
  # google-services.json bleibt es inert, der Rest der App laeuft normal.
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # build_runner bleibt auf 2.15.x und drift_dev entsprechend auf 2.34.0:
  # ab build_runner 2.15.2 wird analyzer >=13.3 und damit meta ^1.18.3
  # verlangt, das SDK-Paket flutter_test pinnt aber meta 1.18.0. Erst mit
  # einem neueren Flutter-SDK loesbar. Dasselbe gilt fuer intl 0.20.3
  # (flutter_localizations haelt 0.20.2 fest).
  drift_dev: ^2.34.0
  build_runner: ^2.15.1
  # App-Icon: Quellgrafik zeichnen (image) und auf die Plattformen verteilen.
  image: ^4.3.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  # Erzeugt AppLocalizations aus lib/l10n/*.arb (Einstellungen: l10n.yaml).
  generate: true
  assets:
    # Eingebackene Haendler-Logos (WebP), siehe tool/fetch_retailer_logos.ps1.
    - assets/logos/

# App-Icon (weisses Haus auf blauem Grund). Neu erzeugen mit:
#   dart run tool/generate_icon.dart
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  adaptive_icon_background: "#2563EB"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256
