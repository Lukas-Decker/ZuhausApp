name: multiapp
description: "Haushalts-App: Inventar, Einkaufsliste, Notizen, Pillen- und Tier-Tracker"
publish_to: 'none'

# Semantische Versionierung: major.minor.patch (+ Build-Nummer).
version: 0.6.0+6

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Zustandsverwaltung und Navigation
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0

  # Lokale Datenhaltung (offline-first)
  drift: ^2.34.2
  drift_flutter: ^0.3.1

  # Hilfsbibliotheken
  uuid: ^4.6.0
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  collection: ^1.19.1
  http: ^1.6.0
  mobile_scanner: ^7.4.0
  # 17.x ist die letzte Reihe ohne das Windows-Backend, das die ATL-Bibliothek
  # von Visual Studio voraussetzt (auf diesem Rechner nicht verfuegbar). Android,
  # iOS, macOS und Linux erhalten damit volle geplante Benachrichtigungen; auf
  # Windows greift der No-op-Pfad des NotificationService (In-App-Hinweise
  # bleiben). Auf >=18 wechseln, sobald ATL installiert ist.
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
