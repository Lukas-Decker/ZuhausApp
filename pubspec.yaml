name: multiapp
description: "Haushalts-App: Inventar, Einkaufsliste, Notizen, Pillen- und Tier-Tracker"
publish_to: 'none'

# Semantische Versionierung: major.minor.patch (+ Build-Nummer).
version: 0.12.0+19

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Zustandsverwaltung und Navigation
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0

  # Lokale Datenhaltung (offline-first)
  drift: ^2.34.2
  drift_flutter: ^0.3.1

  # Hilfsbibliotheken
  uuid: ^4.6.0
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  collection: ^1.19.1
  http: ^1.6.0
  mobile_scanner: ^7.4.0
  flutter_local_notifications: ^22.1.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  supabase_flutter: ^2.16.0
  app_links: ^7.2.1
  win32_registry: ^3.0.3
  # Biometrisches App-Schloss (Windows Hello / Fingerabdruck / Gesicht).
  # 3.x wird gebraucht: zieht local_auth_windows 2.x mit dem modernen
  # C++20-<coroutine>-Header (1.x scheitert an neuem MSVC, Fehler STL1011).
  local_auth: ^3.0.2
  # Datenexport (DSGVO): JSON-Datei speichern/teilen.
  share_plus: ^13.3.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
